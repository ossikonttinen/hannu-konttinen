<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circling.fi – autenttisen yhteyden tila</title>
<meta name="description" content="Läsnäolon, autenttisuuden ja tietoisen vuorovaikutuksen illat Vallilassa: circling, authentic relating ja kehollisuus. Maanantaisin Galleria Sitruunapuussa.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='16' fill='none' stroke='%233e8aa3' stroke-width='3.2'/%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%233e8aa3'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:url" content="https://circling.fi/">
<meta property="og:title" content="circling.fi – autenttisen yhteyden tila">
<meta property="og:description" content="Läsnäolon, autenttisuuden ja tietoisen vuorovaikutuksen illat Vallilassa – circling, authentic relating ja kehollisuus.">
<meta property="og:image" content="https://circling.fi/jakokuva.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- Tekstit: tekstit.md · Ulkoasu: tyyli.css · Tätä tiedostoa ei yleensä tarvitse muokata. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tyyli.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#etusivu">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="var(--turkoosi)" stroke-width="2.4"/>
        <circle cx="20" cy="20" r="3.8" fill="var(--turkoosi)"/>
      </svg>circling.fi</a>
    <button class="menu-btn" aria-label="Valikko" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    <nav></nav>
  </div>
</header>

<main class="wrap" id="sisalto"></main>
<footer><div class="wrap" id="alatunniste"></div></footer>

<script>
const KORISTE = `<svg class="koriste" viewBox="0 0 400 400" aria-hidden="true">
  <circle cx="200" cy="200" r="150" fill="none" stroke="var(--turkoosi)" stroke-width="13"/>
  <circle cx="200" cy="200" r="31" fill="var(--turkoosi)"/>
</svg>`;
/* Ilmoittautumisjärjestelmän osoite (Apps Script, päättyy /exec) */
const API = "https://script.google.com/macros/s/AKfycbw_soiWMMAg7gSkyd8rVzcow8D1Kyx5x-6alziVkjKfvEJwHbowkCtbr3uc2hWIStLq8w/exec";

const KUUT = ["tammi","helmi","maalis","huhti","touko","kesä","heinä","elo","syys","loka","marras","joulu"];

const slug = s => s.toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/å/g,"a").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lueIlta(rivi){
  const [pvm, aika="", otsikko="", paikka="", tila="", linkki=""] = rivi.replace(/^@\s*/,"").split("|").map(s=>s.trim());
  const [d,m,y] = pvm.split(".").map(Number);
  return {pvm:new Date(y, m-1, d, 23, 59), d, m, aika, otsikko, paikka, tila, linkki};
}
function iltaKortti(e){
  const tag = e.linkki ? "a" : "div";
  const href = e.linkki ? ` href="${esc(e.linkki)}"` : "";
  const taynna = /täyn/i.test(e.tila) ? " taynna" : "";
  const avoin = /avoin/i.test(e.otsikko) ? " avoin" : /pikkujoul|joulu/i.test(e.otsikko) ? " joulu" : "";
  return `<${tag} class="ilta${avoin}"${href}>
    <div class="pvm"><div class="d">${e.d}</div><div class="m">${KUUT[e.m-1]||""}</div></div>
    <div><h3>${esc(e.otsikko)}</h3><div class="meta">${esc([e.aika,e.paikka].filter(Boolean).join(" · "))}</div></div>
    ${e.tila ? `<span class="tila${taynna}">${esc(e.tila)}</span>` : ""}
  </${tag}>`;
}
function iltaLista(lista, max){
  // Varalla tekstit.md:n illat; korvataan Sheetin illoilla, kun ne latautuvat
  const varalla = lista.length ? `<div class="illat">${lista.map(iltaKortti).join("")}</div>`
                               : `<p class="ei-iltoja">Uusia iltoja tulossa pian.</p>`;
  return `<div class="illat-api" data-max="${max||""}">${varalla}</div>`;
}

/* ---------- Ilmoittautuminen ---------- */
const ILLAT = {};
const pad = n => String(n).padStart(2,"0");
function ajat(e){
  const [ah,am] = e.alku.split(/[.:]/), [lh,lm] = (e.loppu || e.alku).split(/[.:]/);
  const p = `${e.vuosi}${pad(e.kuukausi)}${pad(e.paiva)}`;
  return {alku:`${p}T${pad(ah)}${pad(am||0)}00`, loppu:`${p}T${pad(lh)}${pad(lm||0)}00`};
}
function kalenteriNapit(e){
  const t = ajat(e);
  const g = "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.otsikko)+
    "&dates="+t.alku+"/"+t.loppu+"&ctz=Europe/Helsinki&location="+encodeURIComponent(e.paikka);
  const es = s => String(s).replace(/([,;\\])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//circling.fi//FI","BEGIN:VEVENT",
    "UID:"+e.id+"@circling.fi","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART;TZID=Europe/Helsinki:"+t.alku,"DTEND;TZID=Europe/Helsinki:"+t.loppu,
    "SUMMARY:"+es(e.otsikko),"LOCATION:"+es(e.paikka),"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  return `<div style="margin-top:12px"><a class="nappi" href="${g}" target="_blank" rel="noopener">Lisää Google-kalenteriin</a>
    <a class="nappi2" href="${url}" download="circling-ilta.ics">Apple / Outlook</a></div>`;
}
function ilmoKortti(e){
  const luokka = e.tyyppi === "avoin" ? " avoin" : e.tyyppi === "joulu" ? " joulu" : "";
  const taynna = e.vapaana === 0;
  const tila = taynna ? "Täynnä" : (e.vapaana != null && e.vapaana <= 5 ? `${e.vapaana} paikkaa jäljellä` : "Ilmoittaudu");
  return `<div class="ilmo">
    <button class="ilta${luokka}" data-id="${esc(e.id)}" ${taynna ? "disabled" : ""} aria-expanded="false">
      <div class="pvm"><div class="d">${e.paiva}</div><div class="m">${KUUT[e.kuukausi-1]}</div></div>
      <div><h3>${esc(e.otsikko)}</h3><div class="meta">${esc(e.viikonpaiva)} klo ${esc(e.alku)}${e.loppu ? "–"+esc(e.loppu) : ""} · ${esc(e.paikka)}</div></div>
      <span class="tila${taynna ? " taynna" : ""}">${esc(tila)}</span>
    </button>
    <form class="lomake" data-id="${esc(e.id)}" novalidate>
      <label>Nimi (etunimi riittää)<input name="nimi" autocomplete="given-name" required maxlength="100"></label>
      <label>Sähköposti (vapaaehtoinen)<input name="email" type="email" autocomplete="email" maxlength="200"></label>
      <label>Viesti ohjaajille (vapaaehtoinen)<textarea name="viesti" maxlength="1000"></textarea></label>
      <label class="valinta"><input type="checkbox" name="muistutus" checked> Lähetä minulle muistutus päivää ennen (vaatii sähköpostin)</label>
      <div class="ansa" aria-hidden="true"><label>Älä täytä<input name="sivusto" tabindex="-1" autocomplete="off"></label></div>
      <button type="submit" class="nappi">Ilmoittaudu iltaan</button>
      <p class="pieni">Jos annat sähköpostin, saat vahvistuksen ja voit perua paikkasi viestin linkistä. Ilman sähköpostia peruutukset: WhatsApp tai info@circling.fi.</p>
      <div class="tulos"></div>
    </form>
  </div>`;
}
function nayta2(el, ok, teksti){ el.innerHTML = `<div class="viesti ${ok ? "ok" : "virhe"}">${esc(teksti)}</div>`; }
async function laheta(ev){
  ev.preventDefault();
  const f = ev.target, tulos = f.querySelector(".tulos"), nappi = f.querySelector("button[type=submit]");
  const data = Object.fromEntries(new FormData(f)); data.ilta = f.dataset.id; data.muistutus = f.muistutus.checked;
  if(!data.nimi.trim()) return nayta2(tulos, false, "Kirjoita nimesi.");
  if(data.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) return nayta2(tulos, false, "Tarkista sähköpostiosoite.");
  nappi.disabled = true; nappi.textContent = "Lähetetään…"; tulos.innerHTML = "";
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data)});
    const v = await r.json();
    if(v.ok){
      f.querySelectorAll("label, button[type=submit], .pieni").forEach(x => x.style.display = "none");
      nayta2(tulos, true, v.jo ? "Olet jo ilmoittautunut tähän iltaan. Tervetuloa!" :
        `Kiitos, ${data.nimi.trim().split(" ")[0]}! Ilmoittautuminen on vastaanotettu${data.email.trim() ? ", ja vahvistus on matkalla sähköpostiisi" : ""}.`);
      if(ILLAT[data.ilta]) tulos.insertAdjacentHTML("beforeend", kalenteriNapit(ILLAT[data.ilta]));
    } else {
      nayta2(tulos, false, v.virhe || "Jokin meni pieleen. Yritä uudelleen.");
      nappi.disabled = false; nappi.textContent = "Ilmoittaudu iltaan";
    }
  }catch(err){
    nayta2(tulos, false, "Yhteys ei toiminut. Yritä hetken päästä uudelleen tai kirjoita: info@circling.fi");
    nappi.disabled = false; nappi.textContent = "Ilmoittaudu iltaan";
  }
}
async function lataaIllat(){
  const paikat = document.querySelectorAll(".illat-api");
  if(!API || !paikat.length) return;
  let illat;
  try{ const d = await (await fetch(API)).json(); if(!d.ok) return; illat = d.illat; }
  catch(e){ return; }  // jos haku ei onnistu, tekstit.md:n illat jäävät näkyviin
  illat.forEach(e => ILLAT[e.id] = e);
  paikat.forEach(p => {
    const lista = p.dataset.max ? illat.slice(0, +p.dataset.max) : illat;
    p.innerHTML = lista.length ? `<div class="illat">${lista.map(ilmoKortti).join("")}</div>` : `<p class="ei-iltoja">Uusia iltoja tulossa pian.</p>`;
    p.querySelectorAll("button.ilta").forEach(b => b.addEventListener("click", () => {
      const f = b.nextElementSibling, auki = !f.classList.contains("auki");
      document.querySelectorAll(".lomake.auki").forEach(x => { x.classList.remove("auki"); x.previousElementSibling.setAttribute("aria-expanded","false"); });
      if(auki){ f.classList.add("auki"); b.setAttribute("aria-expanded","true"); f.querySelector("input").focus(); }
    }));
    p.querySelectorAll("form.lomake").forEach(f => f.addEventListener("submit", laheta));
  });
}

async function rakenna(){
  let md;
  try { md = await (await fetch("tekstit.md", {cache:"no-store"})).text(); }
  catch(e){ document.getElementById("sisalto").innerHTML = "<p style='padding:40px 0'>Tekstejä ei saatu ladattua (tekstit.md).</p>"; return; }
  md = md.replace(/<!--[\s\S]*?-->/g, "");

  // Pilko sivuiksi
  const sivut = [];
  md.split(/^===\s*(.+?)\s*===\s*$/m).forEach((osa,i,arr)=>{
    if(i%2===1){ const piilo=/^\(.*\)$/.test(osa); const nimi=osa.replace(/^\((.*)\)$/,"$1"); sivut.push({nimi, id:slug(nimi), piilo, teksti:arr[i+1]||""}); }
  });

  // Kerää illat kaikilta sivuilta
  const nyt = new Date();
  let kaikki = [];
  sivut.forEach(s => s.teksti.split("\n").forEach(r => { if(/^@\s/.test(r.trim())) kaikki.push(lueIlta(r.trim())); }));
  kaikki = kaikki.filter(e => !isNaN(e.pvm) && e.pvm >= nyt).sort((a,b)=>a.pvm-b.pvm);

  const nav = document.querySelector("nav"), main = document.getElementById("sisalto");
  sivut.forEach(s=>{
    // Iltarivit yhdeksi listaksi
    let t = s.teksti.replace(/(^@\s.*$\n?)+/m, "\n%%ILLAT_KAIKKI%%\n\n");
    let html = marked.parse(t);
    html = html.replace(/<p>\s*%%ILLAT_KAIKKI%%\s*<\/p>/, iltaLista(kaikki))
               .replace(/<p>\s*\{\{illat\}\}\s*<\/p>/g, iltaLista(kaikki.slice(0,3), 3))
                 .replace(/<blockquote>\s*<p>([\s\S]*?)<\/p>\s*<\/blockquote>/g, '<p class="slogan">$1</p>')
               .replace(/<p>\s*\{\{kuva\}\}\s*<\/p>/g, KORISTE)
               .replace(/<a href="([^"]*)">([^<]*)<\/a>\{(nappi2?)\}/g, '<a class="$3" href="$1">$2</a>');
    if(s.id === "alatunniste"){ document.getElementById("alatunniste").innerHTML = html; return; }
    main.insertAdjacentHTML("beforeend", `<section class="sivu" id="sivu-${s.id}">${html}</section>`);
    if(!s.piilo) nav.insertAdjacentHTML("beforeend", `<a href="#${s.id}" data-v="${s.id}">${esc(s.nimi)}</a>`);
  });
  // YouTube-listat videokorteiksi
  document.querySelectorAll("main ul").forEach(ul=>{
    const lis=[...ul.children];
    if(!lis.length || !lis.every(li=>/youtu\.?be/.test(li.querySelector("a")?.href||""))) return;
    ul.classList.add("videot");
    lis.forEach(li=>{
      const a=li.querySelector("a"); const m=a.href.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
      if(!m) return;
      li.className="video";
      li.innerHTML=`<a href="https://youtu.be/${m[1]}"><span class="peukalo" style="background-image:url(https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg)"><span class="play">▶</span></span><span class="vnimi">${esc(a.textContent.trim())}</span></a>`;
    });
  });
  // Lista, jonka kaikki kohdat alkavat lainausmerkillä → palautekortit
  document.querySelectorAll("main ul").forEach(ul=>{
    const lis=[...ul.children];
    if(lis.length && lis.every(li=>/^\s*[”"“]/.test(li.textContent))) ul.classList.add("palautteet");
  });
  // Omalla sivulla (esim. Netlify) video toistuu sivulla klikattaessa; Clauden esikatselussa avautuu YouTubeen
  const UPOTA = !/claude|localhost|^$/i.test(location.hostname);
  // Omalla sivulla ulkoiset linkit avautuvat uuteen välilehteen (esikatselussa tavallisina linkkeinä)
  if(UPOTA) document.querySelectorAll('a[href^="http"]').forEach(a=>{a.target="_blank";a.rel="noopener"});
  if(UPOTA) document.querySelectorAll(".video a").forEach(a=>{
    a.addEventListener("click", ev=>{
      ev.preventDefault();
      const id=a.href.split("/").pop();
      a.querySelector(".peukalo").outerHTML=`<div class="upotus"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="${esc(a.textContent)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
      a.style.cursor="default";
    }, {once:true});
  });
  // Ulkoiset linkit uuteen ikkunaan
  

  const ids = sivut.map(s=>s.id).filter(i=>i!=="alatunniste");
  function nayta(){
    const v = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : ids[0];
    document.querySelectorAll(".sivu").forEach(s=>s.classList.toggle("on", s.id==="sivu-"+v));
    nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on", a.dataset.v===v));
    nav.classList.remove("open");
    window.scrollTo(0,0);
  }
  addEventListener("hashchange", nayta); nayta();
  lataaIllat();
  // Puhelimella: slogan ja pääotsikko yhdelle riville, mahdollisimman isona
  function sovita(){
    document.querySelectorAll(".sivu.on .slogan, .sivu.on h1").forEach(el=>{
      el.style.fontSize=""; el.style.whiteSpace="";
      if(innerWidth>760) return;
      const tila=el.clientWidth; el.style.whiteSpace="nowrap";
      let koko=parseFloat(getComputedStyle(el).fontSize);
      while(el.scrollWidth>tila && koko>10){ koko-=0.5; el.style.fontSize=koko+"px"; }
    });
  }
  addEventListener("hashchange", ()=>setTimeout(sovita,0));
  addEventListener("resize", sovita);
  if(document.fonts) document.fonts.ready.then(sovita);
  sovita();
}
rakenna();
</script>
</body>
</html>
