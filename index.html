<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannu T. Konttinen</title>
<meta name="description" content="Hannu T. Konttinen – kuvanveistäjä ja taidemaalari, Bergen. Billedhugger og maler. Sculptor and painter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, gallery-like; the work speaks, the page steps back.
   IDEA: an exhibition catalogue on plaster-white walls.
   PICTURE: the works themselves, large, uncropped; one banner sculpture on home.
   COLOUR and TYPE: plaster white, near-black ink, bronze accent; Jost light, name letter-spaced like the old logo.
   LAYOUT: name + menu header, wide banner beside intro, masonry gallery, hanging-date exhibition list. */
:root{color-scheme:light;
  --bg:#f2f0ec;--panel:#e7e4de;--ink:#1d1b19;--mute:#6c665e;--line:#d6d1c9;--acc:#8a5a2b}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.6 Jost,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding-block:16px}
.logo{font-weight:400;font-size:clamp(15px,2.2vw,19px);letter-spacing:.32em;text-decoration:none;white-space:nowrap;text-transform:uppercase;margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:2px 18px}
nav a{text-decoration:none;font-size:15px;padding:6px 0;color:var(--mute);border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current]{color:var(--ink);border-color:var(--acc)}
.lang{display:flex;gap:2px}
.lang button{font:inherit;font-size:13px;background:none;border:1px solid transparent;color:var(--mute);padding:6px 8px;min-height:36px;cursor:pointer;border-radius:3px}
.lang button[aria-pressed=true]{color:var(--ink);border-color:var(--line)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{min-height:60vh}
h1,h2,h3{font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,52px)}
h2{font-size:clamp(24px,3vw,32px)}
h3{font-size:19px;font-weight:500}
.band{padding:clamp(28px,5vw,64px) 0}
.mute{color:var(--mute)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,56px);align-items:end}
.hero .pic{aspect-ratio:4/3;background:var(--panel);overflow:hidden}
.hero .pic img{width:100%;height:100%;object-fit:contain}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);max-width:34ch}
.hero .sub{color:var(--acc);margin:14px 0 18px;font-size:17px}
.card{border-top:1px solid var(--ink);padding-top:14px;margin-top:28px;text-decoration:none;display:block}
.card small{display:block;color:var(--acc);font-size:14px}
.news{display:grid;gap:36px;max-width:760px}
.news article{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px}
.news time{color:var(--mute);font-size:15px;white-space:nowrap}
.news img{margin-top:12px;max-height:420px;width:auto}
/* gallery */
.ghead{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.grid{columns:3 260px;column-gap:28px}
.grid.s{columns:4 190px}.grid.l{columns:2 360px;column-gap:40px}
.work{break-inside:avoid;margin:0 0 32px;cursor:zoom-in}
.work .ph{background:var(--panel);overflow:hidden}
.work img{width:100%;height:auto;transition:opacity .4s}
.work .noimg{aspect-ratio:4/5;display:grid;place-items:center;color:var(--mute);font-size:14px;padding:16px;text-align:center}
.work figcaption{padding-top:10px;font-size:15px}
.work figcaption b{font-weight:500;display:block;font-size:16px}
.price{color:var(--acc)}
/* exhibitions */
.ex{margin-bottom:48px}
.ex h2{margin-bottom:18px}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:14px 0;border-top:1px solid var(--line)}
.row .d{color:var(--mute);font-size:15px}
.row .tag{font-size:13px;color:var(--acc);margin-left:8px}
.row p{margin:4px 0 0}
/* about */
.about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,5vw,72px)}
.about section{margin-bottom:32px}
.about h2{margin-bottom:10px}
.contact{background:var(--panel);padding:24px;align-self:start}
.cv{margin-top:24px;border-top:1px solid var(--ink);padding-top:28px}
.cv h3{margin:28px 0 8px}.cv h3:first-of-type{margin-top:16px}
.cv .row{grid-template-columns:120px minmax(0,1fr);padding:8px 0}
.contact dl{margin:0}.contact dt{color:var(--mute);font-size:14px;margin-top:12px}.contact dd{margin:0}
.state{padding:80px 0;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--mute);font-size:14px;margin-top:40px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 97%,black);display:none;grid-template-rows:minmax(0,1fr) auto;padding:56px max(4vw,12px) 20px}
.lb.open{display:grid}
.lb .stage{display:grid;place-items:center;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .info{text-align:center;padding-top:14px;font-size:15px}
.lb .info b{font-weight:500;font-size:17px}
.lb button{position:absolute;font:inherit;background:none;border:0;color:var(--ink);width:48px;height:48px;font-size:28px;cursor:pointer;border-radius:50%}
.lb button:hover{background:var(--panel)}
.lb .x{top:8px;right:8px}.lb .pv{left:8px;top:50%}.lb .nx{right:8px;top:50%}
@media (max-width:760px){
  header{position:static}
  .top{padding-block:12px}
  nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:18px;scrollbar-width:none}
  nav a{flex:none}
  .grid,.grid.s{columns:2;column-gap:14px}.grid.l{columns:1}
  .work figcaption{font-size:14px}
  .hero{grid-template-columns:1fr}.hero .pic{order:-1}
  .about{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:2px}
  .news article{grid-template-columns:1fr;gap:4px}
  .lb .pv,.lb .nx{top:auto;bottom:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap top">
  <a class="logo" href="#" id="logo">Hannu T. Konttinen</a>
  <nav id="nav" aria-label="Valikko"></nav>
  <div class="lang" id="lang">
    <button data-l="no" aria-pressed="false">NO</button>
    <button data-l="fi" aria-pressed="false">FI</button>
    <button data-l="en" aria-pressed="false">EN</button>
  </div>
</div></header>
<main id="main" class="wrap"><p class="state">…</p></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" aria-label="Sulje">×</button>
  <button class="pv" aria-label="Edellinen">‹</button>
  <button class="nx" aria-label="Seuraava">›</button>
  <div class="stage"><img alt=""></div>
  <div class="info"></div>
</div>
<script>
{
/* ===== Asetukset: Sheetin tunnus ===== */
const SHEET_ID = '1gKV4IyeExd1WeibgBH3IHfvaLde4iHgaPe_v4E2iVKg';
const TABS = ['Asetukset','Valikko','Uutiset','Veistokset','Piirustukset','Maalaukset','Muut','Minusta','Näyttelyt','Meriitit'];
const WORK_TABS = ['Veistokset','Piirustukset','Maalaukset','Muut'];

const UI = {
  fi:{now:'Nyt esillä',up:'Tulevat näyttelyt',past:'Aiemmat näyttelyt',next:'Tuleva näyttely',group:'Yhteisnäyttely',
      contact:'Yhteystiedot',home:'Koti',studio:'Ateljee',phone:'Puhelin',email:'Sähköposti',empty:'Ei vielä sisältöä.',
      err:'Sisältöä ei voitu ladata. Yritä hetken päästä uudelleen.',close:'Sulje',prev:'Edellinen',next2:'Seuraava',noimg:'Kuva tulossa',news:'Ajankohtaista',more:'Lisätietoja'},
  no:{now:'Nå',up:'Kommende utstillinger',past:'Tidligere utstillinger',next:'Kommende utstilling',group:'Kollektivutstilling',
      contact:'Kontakt',home:'Hjem',studio:'Atelier',phone:'Telefon',email:'E-post',empty:'Ikke noe innhold ennå.',
      err:'Innholdet kunne ikke lastes. Prøv igjen om litt.',close:'Lukk',prev:'Forrige',next2:'Neste',noimg:'Bilde kommer',news:'Aktuelt',more:'Mer informasjon'},
  en:{now:'Now showing',up:'Upcoming exhibitions',past:'Past exhibitions',next:'Upcoming exhibition',group:'Group exhibition',
      contact:'Contact',home:'Home',studio:'Studio',phone:'Phone',email:'Email',empty:'Nothing here yet.',
      err:'The content could not be loaded. Please try again shortly.',close:'Close',prev:'Previous',next2:'Next',noimg:'Image coming',news:'News',more:'More information'}
};
const CV_CATS = {
  'Koulutus':['Koulutus','Utdanning','Education'],
  'Apurahat':['Apurahat','Stipender','Grants'],
  'Palkinnot':['Palkinnot','Priser','Awards'],
  'Työskentelyjaksot ulkomailla':['Työskentelyjaksot ulkomailla','Studieopphold i utlandet','Study residencies abroad'],
  'Yhteisnäyttelyt':['Yhteisnäyttelyt','Kollektivutstillinger','Group exhibitions'],
  'Vuosi- ja aluenäyttelyt':['Vuosi- ja aluenäyttelyt','Års- og regionale utstillinger','Annual and regional exhibitions'],
  'Kokoelmat':['Edustettuna kokoelmissa','Representert i samlinger','Represented in collections'],
  'Julkiset teokset':['Julkiset teokset ja tilaustyöt','Offentlige verk og oppdrag','Public works and commissions'],
  'Konsultointi':['Konsultointi','Konsulentoppdrag','Consulting'],
  'Opetus':['Opetus','Undervisning','Teaching'],
  'Muu toiminta':['Muu toiminta','Annen virksomhet','Other activities'],
  'Jäsenyydet':['Jäsenyydet','Medlemskap','Memberships'],
  'Luottamustoimet':['Luottamustoimet','Verv','Positions of trust'],
  'Muut':['Muut','Annet','Other']
};
const CV_TITLE = {fi:'Ansioluettelo', no:'CV', en:'CV'};
const MONTHS = {
  fi:['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'],
  no:['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December']
};

let D = {}, IMG = {}, L = 'en';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para = s => String(s||'').split(/\n\s*\n/).map(p => '<p>' + esc(p).replace(/\n/g,'<br>') + '</p>').join('');
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const norm = s => String(s).normalize('NFC').trim().toLowerCase().replace(/\.(jpe?g|png|gif|webp|heic|tiff?)$/,'');
const t = k => UI[L][k];

/* ===== Datan lataus (Google Sheets gviz, JSONP) ===== */
let seq = 0;
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = '__cb' + (++seq), s = document.createElement('script');
    const tm = setTimeout(() => { cleanup(); rej(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(tm); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('load')); };
    s.src = url.replace('{cb}', cb);
    document.head.appendChild(s);
  });
}
function cell(v){
  if (v == null) return '';
  if (typeof v === 'string'){
    let m = v.match(/^Date\((\d+),(\d+),(\d+)/);
    if (m) return new Date(+m[1], +m[2], +m[3]);
    m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    if (v === 'TRUE') return true; if (v === 'FALSE') return false;
  }
  return v;
}
function objs(head, rows){
  return rows.map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h.trim()] = cell(r[i]); }); return o; });
}
async function loadTab(name){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&sheet=${encodeURIComponent(name)}&tqx=responseHandler:{cb}&_=${Date.now()}`;
  const d = await jsonp(url);
  if (d.status === 'error') throw new Error(name);
  const head = d.table.cols.map(c => c.label);
  return objs(head, d.table.rows.map(r => (r.c || []).map(c => c ? c.v : null)));
}
async function load(){
  if (window.EMBED){ for (const k of TABS){ const a = EMBED[k] || [[]]; D[k] = objs(a[0], a.slice(1)); } return; }
  let fails = 0;
  const res = await Promise.all(TABS.map(n => loadTab(n).catch(() => { fails++; return []; })));
  TABS.forEach((n, i) => D[n] = res[i]);
  if (fails === TABS.length || !(D.Valikko||[]).length) throw new Error('nodata');
  const script = set('Kuvaskripti');
  if (/^https:\/\/script\.google/.test(script)){
    try { IMG = await jsonp(script + (script.includes('?') ? '&' : '?') + 'callback={cb}'); } catch(e){ IMG = {}; }
  }
}

/* ===== Apufunktiot ===== */
const LU = () => L.toUpperCase();
function tr(r, f){
  if (L === 'fi') return r[f] ?? '';
  return r[f+' '+LU()] || r[f+' '+LU()+' auto'] || r[f] || '';
}
function set(key, translate){
  const r = (D.Asetukset||[]).find(x => String(x.Avain).trim() === key);
  if (!r) return '';
  return translate ? tr(r, 'Arvo') : String(r.Arvo ?? '').trim();
}
const shown = (r, main) => r[main] !== '' && r[main] != null && r.Piilota !== true;
function img(v, w){
  v = String(v || '').trim(); if (!v || (window.EMBED && EMBED.noImages)) return '';
  const drive = id => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
  if (/^https?:\/\//.test(v)){
    const m = v.match(/drive\.google\.com\/.*?(?:\/d\/|[?&]id=)([\w-]{20,})/);
    return m ? drive(m[1]) : v;
  }
  const id = IMG[norm(v)];
  return id ? drive(id) : '';
}
function fmtDate(d){ return L === 'en' ? `${d.getDate()} ${MONTHS.en[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`; }
function range(r){
  const txt = tr(r, 'Aika'); if (txt) return txt;
  const s = r.Alkaa, e = r['Päättyy'] instanceof Date ? r['Päättyy'] : null;
  if (!(s instanceof Date)) return '';
  if (!e) return fmtDate(s);
  const lastDay = new Date(e.getFullYear(), e.getMonth()+1, 0).getDate();
  const wholeMonths = s.getDate() === 1 && e.getDate() === lastDay;
  if (wholeMonths && s.getFullYear() === e.getFullYear()){
    if (s.getMonth() === 0 && e.getMonth() === 11) return String(s.getFullYear());
    const M = MONTHS[L];
    return (s.getMonth() === e.getMonth() ? M[s.getMonth()] : `${M[s.getMonth()]}–${M[e.getMonth()]}`) + ' ' + s.getFullYear();
  }
  if (L === 'en') return `${s.getDate()} ${MONTHS.en[s.getMonth()].slice(0,3)} – ${fmtDate(e)}`;
  return s.getFullYear() === e.getFullYear() ? `${s.getDate()}.${s.getMonth()+1}.–${fmtDate(e)}` : `${fmtDate(s)}–${fmtDate(e)}`;
}
function status(r){
  const today = new Date(); today.setHours(0,0,0,0);
  const s = r.Alkaa instanceof Date ? r.Alkaa : null; if (!s) return 'past';
  const e = r['Päättyy'] instanceof Date ? r['Päättyy'] : s;
  return s > today ? 'up' : (e >= today ? 'now' : 'past');
}
const exhibitions = () => (D['Näyttelyt']||[]).filter(r => shown(r, 'Nimi'));
const menu = () => (D.Valikko||[]).filter(r => shown(r, 'Sivu'));

/* ===== Näkymät ===== */
function exCard(r, label){
  return `<a class="card" href="#${slug(menuName('Näyttelyt'))}"><small>${esc(label)} · ${esc(range(r))}</small>
    <h3>${esc(r.Nimi)}</h3><span class="mute">${esc(tr(r,'Paikka'))}</span></a>`;
}
function vHome(){
  const ex = exhibitions(), now = ex.filter(r => status(r) === 'now'),
        up = ex.filter(r => status(r) === 'up').sort((a,b) => a.Alkaa - b.Alkaa);
  const banner = IMG.__etusivu ? `https://lh3.googleusercontent.com/d/${IMG.__etusivu}=w1800` : img(set('Bannerikuva'), 1800);
  const news = (D.Uutiset||[]).filter(r => shown(r, 'Otsikko')).sort((a,b) => (b['Päivämäärä']||0) - (a['Päivämäärä']||0));
  return `<section class="band hero">
    <div><h1>${esc(set('Nimi') || 'Hannu T. Konttinen')}</h1>
      <div class="sub">${esc(set('Alaotsikko', true))}</div>
      <p class="lead">${esc(set('Etusivun teksti', true))}</p>
      ${now.map(r => exCard(r, t('now'))).join('')}${up.slice(0,1).map(r => exCard(r, t('next'))).join('')}
    </div>
    <div class="pic">${banner ? `<img src="${esc(banner)}" alt="">` : ''}</div>
  </section>
  ${news.length ? `<section class="band"><h2 style="margin-bottom:28px">${esc(menuName('Uutiset'))}</h2><div class="news">${news.map(r => {
    const im = img(r.Kuva, 1200), d = r['Päivämäärä'] instanceof Date ? fmtDate(r['Päivämäärä']) : '';
    return `<article><time>${esc(d)}</time><div><h3>${esc(tr(r,'Otsikko'))}</h3>${para(tr(r,'Teksti'))}${im ? `<img src="${esc(im)}" alt="" loading="lazy">` : ''}</div></article>`;
  }).join('')}</div></section>` : ''}`;
}
let LIST = [];
function vWorks(tab){
  const prices = set('Näytä hinnat').toLowerCase() === 'kyllä';
  // Teos piilotetaan, jos sen kuvan tiedostonimeä ei enää löydy kuvakansiosta
  const imgsOn = Object.keys(IMG).length > 0;
  const missing = r => { const k = String(r.Kuva || '').trim(); return imgsOn && k && !/^https?:\/\//.test(k) && !IMG[norm(k)]; };
  LIST = (D[tab]||[]).filter(r => (shown(r, 'Nimi') || (r.Kuva && r.Piilota !== true)) && !missing(r));
  const meta = r => [r.Vuosi, tr(r,'Tekniikka'), r.Koko].filter(Boolean).map(esc).join(' · ');
  if (!LIST.length) return `<section class="band"><h1>${esc(menuName(tab))}</h1><p class="state">${t('empty')}</p></section>`;
  return `<section class="band"><div class="ghead"><h1>${esc(menuName(tab))}</h1><span class="mute">${LIST.length}</span></div>
  <div class="grid ${({pieni:'s', suuri:'l'})[set('Gallerian koko').toLowerCase()] || ''}">${LIST.map((r, i) => {
    const im = img(r.Kuva, 900);
    return `<figure class="work" data-i="${i}" tabindex="0">
      <div class="ph">${im ? `<img src="${esc(im)}" alt="${esc(tr(r,'Nimi'))}" loading="lazy">` : `<div class="noimg">${t('noimg')}</div>`}</div>
      <figcaption><b>${esc(tr(r,'Nimi'))}</b><span class="mute">${meta(r)}</span>
      ${prices && r.Hinta ? `<div class="price">${esc(r.Hinta)}</div>` : ''}</figcaption></figure>`;
  }).join('')}</div></section>`;
}
function vEx(){
  const ex = exhibitions(), by = k => ex.filter(r => status(r) === k);
  const up = by('up').sort((a,b) => a.Alkaa - b.Alkaa), now = by('now'), past = by('past').sort((a,b) => (b.Alkaa||0) - (a.Alkaa||0));
  const row = r => `<div class="row"><div class="d">${esc(range(r))}</div><div>
      <h3>${esc(r.Nimi)}${String(r.Tyyppi).startsWith('Yhteis') ? `<span class="tag">${t('group')}</span>` : ''}</h3>
      <span class="mute">${esc(tr(r,'Paikka'))}</span>${tr(r,'Kuvaus') ? para(tr(r,'Kuvaus')) : ''}
      ${/^https?:\/\//.test(r.Linkki||'') ? `<p><a href="${esc(r.Linkki)}">${t('more')} →</a></p>` : ''}</div></div>`;
  const sec = (h, a) => a.length ? `<div class="ex"><h2>${h}</h2>${a.map(row).join('')}</div>` : '';
  return `<section class="band"><h1 style="margin-bottom:40px">${esc(menuName('Näyttelyt'))}</h1>
    ${sec(t('now'), now)}${sec(t('up'), up)}${sec(t('past'), past)}${ex.length ? '' : `<p class="state">${t('empty')}</p>`}</section>`;
}
function contactBlock(){
  const items = [[t('home'), set('Kotiosoite')], [t('studio'), set('Ateljee')], [t('phone'), set('Puhelin')], [t('email'), set('Sähköposti')]].filter(x => x[1]);
  const fb = set('Facebook');
  return `<aside class="contact"><h3>${t('contact')}</h3><dl>${items.map(([k, v]) => `<dt>${k}</dt><dd>${
    k === t('email') ? `<a href="mailto:${esc(v)}">${esc(v)}</a>` : k === t('phone') ? `<a href="tel:${esc(v.replace(/\s/g,''))}">${esc(v)}</a>` : esc(v)}</dd>`).join('')}
    ${/^https?:\/\//.test(fb) ? `<dt>Facebook</dt><dd><a href="${esc(fb)}">facebook</a></dd>` : ''}</dl></aside>`;
}
function vAbout(){
  const rows = (D.Minusta||[]).filter(r => shown(r, 'Teksti') || shown(r, 'Otsikko'));
  return `<section class="band"><h1 style="margin-bottom:36px">${esc(menuName('Minusta'))}</h1><div class="about"><div>${rows.map((r, i) => {
    // Minusta-kansion uusin kuva korvaa ensimmäisen osion kuvan
    const im = (i === 0 && IMG.__minusta) ? `https://lh3.googleusercontent.com/d/${IMG.__minusta}=w1200` : img(r.Kuva, 1200);
    return `<section>${r.Otsikko ? `<h2>${esc(tr(r,'Otsikko'))}</h2>` : ''}${para(tr(r,'Teksti'))}${im ? `<img src="${esc(im)}" alt="" loading="lazy">` : ''}</section>`;
  }).join('')}${cvBlock()}</div>${contactBlock()}</div></section>`;
}
function cvBlock(){
  const rows = (D.Meriitit||[]).filter(r => shown(r, 'Teksti'));
  if (!rows.length) return '';
  const li = {fi:0, no:1, en:2}[L];
  const yr = r => +((String(r.Vuosi).match(/\d{4}/g) || [0]).pop());
  const cats = Object.keys(CV_CATS);
  const groups = [...new Set(rows.map(r => String(r.Kategoria || 'Muut').trim()))]
    .sort((a, b) => (cats.indexOf(a) + 99) % 99 - (cats.indexOf(b) + 99) % 99);
  return `<div class="cv"><h2>${CV_TITLE[L]}</h2>${groups.map(g => `<h3>${esc(CV_CATS[g] ? CV_CATS[g][li] : g)}</h3>${
    rows.filter(r => String(r.Kategoria || 'Muut').trim() === g).sort((a, b) => yr(b) - yr(a))
      .map(r => `<div class="row"><div class="d">${esc(r.Vuosi)}</div><div>${esc(tr(r, 'Teksti'))}</div></div>`).join('')}`).join('')}</div>`;
}

/* ===== Reititys ja piirto ===== */
function menuName(sivu){
  const r = (D.Valikko||[]).find(x => x.Sivu === sivu);
  if (!r) return sivu;
  return L === 'fi' ? r.Nimi : (r['Nimi ' + LU()] || r.Nimi);
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const m = menu(), hit = m.find(r => [r.Sivu, r.Nimi, r['Nimi NO'], r['Nimi EN']].some(n => n && slug(n) === h));
  return hit ? hit.Sivu : 'Uutiset';
}
function render(){
  document.documentElement.lang = L === 'no' ? 'nb' : L;
  const cur = route(), name = set('Nimi') || 'Hannu T. Konttinen';
  $('#logo').textContent = name;
  $('#nav').innerHTML = menu().map(r => `<a href="#${r.Sivu === 'Uutiset' ? '' : slug(menuName(r.Sivu))}"${r.Sivu === cur ? ' aria-current="page"' : ''}>${esc(menuName(r.Sivu))}</a>`).join('');
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === L));
  const v = cur === 'Uutiset' ? vHome() : cur === 'Näyttelyt' ? vEx() : cur === 'Minusta' ? vAbout() : WORK_TABS.includes(cur) ? vWorks(cur) : vHome();
  $('#main').innerHTML = v;
  document.title = cur === 'Uutiset' ? name : `${menuName(cur)} – ${name}`;
  $('#foot').innerHTML = `© ${new Date().getFullYear()} ${esc(name)}${set('Ateljee') ? ' · ' + esc(set('Ateljee')) : ''}`;
  const lb = $('#lb');
  lb.querySelector('.x').ariaLabel = t('close'); lb.querySelector('.pv').ariaLabel = t('prev'); lb.querySelector('.nx').ariaLabel = t('next2');
}

/* ===== Kuvan suurennus ===== */
let at = -1;
function show(i){
  if (!LIST.length) return;
  at = (i + LIST.length) % LIST.length;
  const r = LIST[at], lb = $('#lb'), im = img(r.Kuva, 2000);
  const prices = set('Näytä hinnat').toLowerCase() === 'kyllä';
  lb.querySelector('img').src = im || ''; lb.querySelector('img').alt = tr(r,'Nimi');
  lb.querySelector('img').style.visibility = im ? 'visible' : 'hidden';
  lb.querySelector('.info').innerHTML = `<b>${esc(tr(r,'Nimi'))}</b><div class="mute">${[r.Vuosi, tr(r,'Tekniikka'), r.Koko].filter(Boolean).map(esc).join(' · ')}</div>${
    tr(r,'Kuvaus') ? `<div>${esc(tr(r,'Kuvaus'))}</div>` : ''}${prices && r.Hinta ? `<div class="price">${esc(r.Hinta)}</div>` : ''}`;
  lb.classList.add('open'); document.body.style.overflow = 'hidden';
}
function hide(){ $('#lb').classList.remove('open'); document.body.style.overflow = ''; at = -1; }
document.addEventListener('click', e => {
  const w = e.target.closest('.work'); if (w) return show(+w.dataset.i);
  if (e.target.closest('.lb .x') || e.target.classList.contains('stage')) return hide();
  if (e.target.closest('.lb .pv')) return show(at - 1);
  if (e.target.closest('.lb .nx')) return show(at + 1);
  const b = e.target.closest('#lang button');
  if (b){ L = b.dataset.l; try { localStorage.setItem('lang', L); } catch(_){} render(); }
});
document.addEventListener('keydown', e => {
  if (at >= 0){ if (e.key === 'Escape') hide(); if (e.key === 'ArrowLeft') show(at - 1); if (e.key === 'ArrowRight') show(at + 1); return; }
  const w = e.target.closest && e.target.closest('.work'); if (w && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); show(+w.dataset.i); }
});
let tx = null;
$('#lb').addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
$('#lb').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1)); tx = null; });
window.addEventListener('hashchange', () => { hide(); render(); window.scrollTo(0, 0); });

/* ===== Käynnistys ===== */
(async () => {
  let saved = null; try { saved = localStorage.getItem('lang'); } catch(_){}
  L = ['no','fi','en'].includes(saved) ? saved : 'no'; // oletuskieli: norja
  try { await load(); render(); }
  catch(e){
    $('#main').innerHTML = `<p class="state">${t('err')}</p>`;
    console.warn('Sheetin lataus epäonnistui. Tarkista: Sheet jaettu "Kuka tahansa linkin saanut – katselija", ja sivu avataan verkko-osoitteesta (ei Clauden tiedostoesikatselusta).');
  }
})();
}
</script>
</body>
</html>
